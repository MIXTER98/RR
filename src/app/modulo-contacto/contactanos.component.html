<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CONTACTOS</title>
</head>
<body>
<section class="contact">
  <h2 class="section-title">Contáctanos</h2>
  <p class="section-subtitle">
    Estamos listos para ayudarte en tu próximo proyecto. Escríbenos y recibe una asesoría personalizada.
  </p>

  <!-- Formulario de contacto -->
  <form class="contact-form">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" placeholder="Tu nombre completo" required>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="ejemplo@correo.com" required>
    </div>

    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea id="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
    </div>

    <button type="submit" class="cta-btn">Enviar</button>
  </form>

  <!-- Información adicional -->
  <div class="contact-info">
    <p><strong>Teléfono:</strong> +51 999 999 999</p>
    <p><strong>Correo:</strong> contacto&#64;rrconstructiva.com</p>
    <p><strong>Dirección:</strong> San Juan Bautista, Ayacucho, Perú</p>
  </div>

  <!-- Botón rápido a WhatsApp -->
  <a href="https://wa.me/51999999999" target="_blank" class="whatsapp-btn">
    Escríbenos por WhatsApp
  </a>
</section>
</body>
</html>
