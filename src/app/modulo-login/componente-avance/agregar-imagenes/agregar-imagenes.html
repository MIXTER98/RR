<div class="m-4 space-y-6">
    <!-- DATOS DEL USUARIO -->
    <fieldset class="border-2 border-[#004080] rounded-lg p-6 relative">
        <legend class="text-2xl font-bold px-2 text-[#004080]">DATOS DEL USUARIO:</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1 text-gray-700">NOMBRE DEL USUARIO:</label>
                <input type="text" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1 text-gray-700">APELLIDO DEL USUARIO:</label>
                <input type="text" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
            </div>
        </div>
    </fieldset>

    <!-- DATOS DEL AVANCE -->
    <fieldset class="border-2 border-[#004080] rounded-lg p-6 relative">
        <legend class="text-2xl font-bold px-2 text-[#004080]">DATOS DEL AVANCE:</legend>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1 text-gray-700">RUTA DE LA IMAGEN:</label>
                <input type="text" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1 text-gray-700">FECHA:</label>
                <input type="text" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1 text-gray-700">PORCENTAJE AVANCE:</label>
                <input type="text" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
            </div>
        </div>
    </fieldset>

    <!-- BOTONES -->
    <div class="flex justify-end space-x-4 pt-2">
        
    </div>
</div>
