<section>
  <div class="flex items-center justify-center min-h-screen bg-gray-100">
    <form class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
      <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Usuario</label>
        <input type="text" [(ngModel)]="nombreLogin" name="nombreLogin" autocomplete="username"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border-blue-700 shadow-blue-300"
          placeholder="Ingresa tu usuario">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" name="contrasena" autocomplete="current-password"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border-blue-700 shadow-blue-300"
          placeholder="Ingresa tu contraseña" />
      </div>
      <button type="button" (click)="funcionlogin()"
        class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
        Iniciar sesión
      </button>
    </form>
    <p *ngIf="mensaje" class="mt-4 text-center font-semibold" [ngClass]="{
    'text-green-600': tipomensaje === 'exito',
    'text-red-600': tipomensaje === 'error',
    }">{{mensaje}}</p>
  </div>
</section>
